name: Generate Daily LeetCode

on:
  schedule:
    # 9:30 AM Eastern Time (13:30 UTC in EDT)
    - cron: '30 13 * * *'
    # 5:00 PM Eastern Time (21:00 UTC in EDT)
    - cron: '0 21 * * *'
    # 10:00 PM Eastern Time (02:00 UTC next day in EDT)
    - cron: '0 2 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate Problem
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT || secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'us-central1' }}
        run: |
          TIMES=$(( ( RANDOM % 2 ) + 1 ))
          echo "Generating $TIMES problems today..."
          for i in $(seq 1 $TIMES); do
            echo "Generating problem $i/$TIMES"
            python generate_daily_problem.py
            sleep 2 # Brief pause to avoid API rate limits
          done

      - name: Commit and Push
        run: |
          git config --global user.name 'jhqntdv'
          git config --global user.email '60950840+jhqntdv@users.noreply.github.com'
          git add .
          
          # Check if there are any changes to commit. If there are, commit and push them.
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily LeetCode problem" && git push)
