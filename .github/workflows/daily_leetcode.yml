name: Generate Daily LeetCode

on:
  schedule:
    # 2:00 AM UTC is 10:00 PM Eastern Daylight Time (EDT)
    - cron: '0 2 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate Problem
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_daily_problem.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          
          # Check if there are any changes to commit. If there are, commit and push them.
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily LeetCode problem" && git push)
